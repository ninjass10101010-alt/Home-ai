services:
  pocketbase:
    image: ghcr.io/muchobien/pocketbase:latest
    ports:
      - "8090:8090"
    container_name: pocketbase
    restart: unless-stopped
    volumes:
      - pocketbase_data:/pb_data
    networks:
      - dashboard-net

  home-dashboard:
    build:
      context: .
      args:
        - NEXT_PUBLIC_PB_URL=http://pocketbase:8090
    container_name: consuela-dashboard
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - .:/app-source
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_PB_URL=http://pocketbase:8090
      # Fail fast instead of booting with known defaults — set both in .env
      - PB_ADMIN_EMAIL=${PB_ADMIN_EMAIL:?set PB_ADMIN_EMAIL in .env}
      - PB_ADMIN_PASS=${PB_ADMIN_PASS:?set PB_ADMIN_PASS in .env}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - GOOGLE_OAUTH_SCOPES=${GOOGLE_OAUTH_SCOPES:-openid email https://www.googleapis.com/auth/calendar}
      - CONSUELA_ENCRYPTION_KEY=${CONSUELA_ENCRYPTION_KEY}
      # Cron routes reject ALL traffic when this is empty (fail-closed), so
      # scheduled syncs/briefings silently stop without it — required.
      - CRON_SECRET=${CRON_SECRET:?set CRON_SECRET in .env}
      # Server-only gate for /api/admin/* self-calls from chat tools.
      - ADMIN_SECRET=${ADMIN_SECRET:?set ADMIN_SECRET in .env}
      # Signs httpOnly session cookies — required or login will fail closed.
      - SESSION_SECRET=${SESSION_SECRET:?set SESSION_SECRET in .env}
            - HERMES_API_URL=http://hermes-agent-2:8642
      - HERMES_API_KEY=${HERMES_API_KEY:-consuela-api-key-2026}
            - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-}
      - TELEGRAM_MIRROR_BOT_TOKEN=${TELEGRAM_MIRROR_BOT_TOKEN}
      - HA_HOST=${HA_HOST:-}
      - HA_TOKEN=${HA_TOKEN:-}
      - MQTT_BROKER=${MQTT_BROKER:-}
      - MQTT_USER=${MQTT_USER:-}
      - MQTT_PASS=${MQTT_PASS:-}
      - HA_GROCERY_TODO_NAME=${HA_GROCERY_TODO_NAME:-}
      - TELEGRAM_ALERT_CHAT_ID=${TELEGRAM_ALERT_CHAT_ID:-}
      - GMAIL_USER=${GMAIL_USER:-}
      - GMAIL_APP_PASSWORD=${GMAIL_APP_PASSWORD:-}
      - INSTACART_API_KEY=${INSTACART_API_KEY:-}
    networks:
      - dashboard-net

volumes:
  pocketbase_data:

networks:
  dashboard-net:
    name: familydashboard_consuela-net
    external: true
